<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino Runner</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main>
    <h1>Dino Runner</h1>
    <p class="score">점수 <span id="score">0</span></p>
    <canvas id="game" width="900" height="260" aria-label="공룡 러너 게임. Space, 위쪽 화살표 또는 클릭으로 시작하고 점프합니다."></canvas>
    <button id="start-button" type="button">시작</button>
    <p class="instructions">Space / ↑ / 게임 화면 클릭으로 시작·점프<br>공중에서는 다시 점프할 수 없습니다. 게임 오버 후 같은 조작으로 재시작하세요.</p>
  </main>
</body>
</html>
